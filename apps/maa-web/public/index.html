<!DOCTYPE html>
<html lang="zh-CN" class="app-resize">
<head>
  <title>MAA Docker Web</title>
  <meta charset="UTF-8"/>
  <meta name="theme-color" content="#EEE"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="./windows-ui/config/app-config.css"/>
  <link rel="stylesheet" href="./windows-ui/windows-ui.min.css"/>
  <link rel="stylesheet" href="./windows-ui/icons/winui-icons.min.css"/>
  <link rel="stylesheet" href="./style.css?v=0.3.0"/>
</head>
<body>
  <div class="app-navbar-wrap" id="NavBarMain">
    <div class="app-navbar-topbar-mobile">
      <span class="app-navbar-toggler" data-win-toggle="navbar-left" data-win-target="#NavBarMain"></span>
      <div><span class="app-navbar-name">MAA Docker Web</span></div>
    </div>
    <nav class="app-navbar">
      <div class="app-navbar-header">
        <span class="app-navbar-toggler" data-win-toggle="navbar-left" data-win-target="#NavBarMain" aria-controls="NavBarMain" aria-label="Toggle navigation"></span>
        <span class="app-navbar-name">MAA Docker Web</span>
      </div>
      <ul class="app-navbar-list" id="app-navbar-list">
        <label class="app-navbar-theme-switch">
          <input id="app-navbar-theme-switch" type="checkbox" checked>
          <div class="app-navbar-theme-switch-icon"></div>
        </label>
        <li class="app-navbar-list-item"><a href="#/tasks" class="active"><i class="icons10-tasks"></i><span>任务</span></a></li>
        <li class="app-navbar-list-item"><a href="#/schedule" class="unactive"><i class="icons10-calendar"></i><span>日程</span></a></li>
        <li class="app-navbar-list-item"><a href="#/settings" class="unactive"><i class="icons10-settings"></i><span>设置</span></a></li>
        <li class="app-navbar-list-item"><a href="#/runtime" class="unactive"><i class="icons10-download"></i><span>Runtime</span></a></li>
        <li class="app-navbar-list-item"><a href="#/logs" class="unactive"><i class="icons10-document"></i><span>日志</span></a></li>
        <li class="app-navbar-list-item"><a href="#/features" class="unactive"><i class="icons10-numbered-list"></i><span>功能对照</span></a></li>
        <li class="app-navbar-list-item"><a href="#/about" class="unactive"><i class="icons10-info"></i><span>关于</span></a></li>
      </ul>
    </nav>
  </div>
  <div class="app-page-container has-padding" id="page">
    <h2 class="mdw-title">加载中…</h2>
    <p class="mdw-muted">如果此文字长时间停留，说明 JavaScript 未运行（下方会显示具体错误）。</p>
    <noscript><p class="mdw-error">浏览器已禁用 JavaScript，本页面无法工作。</p></noscript>
  </div>

  <script>
    // Show any script error on the page itself instead of a silent blank screen.
    window.addEventListener('error', function (e) {
      var el = document.getElementById('page');
      if (el) {
        el.innerHTML += '<p class="mdw-error">脚本错误: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + '</p>';
      }
    });
    window.addEventListener('unhandledrejection', function (e) {
      var el = document.getElementById('page');
      if (el) {
        el.innerHTML += '<p class="mdw-error">异步错误: ' + String((e.reason && e.reason.message) || e.reason) + '</p>';
      }
    });
  </script>
  <script src="./windows-ui/windows-ui.min.js?v=0.3.0"></script>
  <script src="./app.js?v=0.3.0"></script>
</body>
</html>
