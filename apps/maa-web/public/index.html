<!DOCTYPE html>
<html lang="zh-CN" class="app-resize">
<head>
  <meta charset="UTF-8"/>
  <title>MAA for NAS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- 本地 vendored windows-ui（与正式站同一份 dist，内网/离线可用） -->
  <link rel="stylesheet" href="./windows-ui/config/app-config.css"/>
  <link rel="stylesheet" href="./windows-ui/windows-ui.min.css"/>
  <link rel="stylesheet" href="./windows-ui/icons/winui-icons.min.css"/>
  <link rel="stylesheet" href="./style.css?v=1.9.2"/>
</head>
<body data-theme="light">
  <div class="app-navbar-wrap" id="NavBarMain">
    <div class="app-navbar-topbar-mobile">
      <span class="app-navbar-toggler" data-win-toggle="navbar-left" data-win-target="#NavBarMain"></span>
      <div><span class="app-navbar-name">MAA for NAS</span></div>
    </div>
    <nav class="app-navbar">
      <div class="app-navbar-header">
        <span class="app-navbar-toggler" data-win-toggle="navbar-left" data-win-target="#NavBarMain" aria-controls="NavBarMain" aria-label="Toggle navigation"></span>
        <span class="app-navbar-name">MAA for NAS</span>
      </div>
      <ul class="app-navbar-list" id="app-navbar-list">
        <label class="app-navbar-theme-switch">
          <input id="theme-switch" type="checkbox">
          <div class="app-navbar-theme-switch-icon"></div>
        </label>
        <li class="app-navbar-list-item"><a href="#/home" class="active"><i class="icons10 icons10-home"></i><span>主页</span></a></li>
        <li class="app-navbar-list-item"><a href="#/tasks" class="unactive"><i class="icons10 icons10-tasks"></i><span>一键长草</span></a></li>
        <li class="app-navbar-list-item"><a href="#/copilot" class="unactive"><i class="icons10 icons10-controller"></i><span>自动战斗</span></a></li>
        <li class="app-navbar-list-item"><a href="#/schedule" class="unactive"><i class="icons10 icons10-calendar"></i><span>日程</span></a></li>
        <li class="app-navbar-list-item"><a href="#/tools" class="unactive"><i class="icons10 icons10-search"></i><span>小工具</span></a></li>
        <li class="app-navbar-list-item"><a href="#/logs" class="unactive"><i class="icons10 icons10-document"></i><span>日志</span></a></li>
        <li class="app-navbar-list-item"><a href="#/settings" class="unactive"><i class="icons10 icons10-settings"></i><span>设置</span></a></li>
      </ul>
    </nav>
  </div>

  <div class="mdw-col">
    <div class="mdw-offline" id="offline-banner"></div>
    <header class="mdw-titlebar">
      <div class="mdw-titlebar-l">
        <span class="app-navbar-toggler mdw-titlebar-burger" data-win-toggle="navbar-left" data-win-target="#NavBarMain" aria-label="Toggle navigation"></span>
        <span class="mdw-titlebar-title">MAA for NAS</span>
      </div>
      <div class="mdw-titlebar-r">
        <span class="mdw-titlebar-ver">v0.5.0 · MAA v6.17.5</span>
        <span class="mdw-chip"><span class="mdw-dot"></span>设备未连接</span>
        <button type="button" class="app-btn mdw-btn-primary" id="btn-connect">连接</button>
      </div>
    </header>
    <div class="app-page-container has-padding" id="page">
      <h2 class="mdw-h1">加载中…</h2>
    </div>
    <footer class="mdw-statusbar">
      <span id="sb-left"></span>
      <span id="sb-right"></span>
    </footer>
  </div>

  <script src="./windows-ui/windows-ui.min.js"></script>
  <script src="./maa-data.js?v=1.3.0"></script>
  <script src="./app.js?v=1.9.2"></script>
