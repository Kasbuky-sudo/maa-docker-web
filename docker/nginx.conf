server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA
    location / {
        try_files $uri $uri/ /index.html;
        # HTML must not be cached; assets are fingerprinted via query string
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # API proxied to maa-server (compose-internal network only)
    # 连接测试 / 任务下发会让 MaaCore 同步加载资源并等待设备握手，可能远超 nginx
    # 默认的 60s → 之前前端拿到的是 504。这里把读写超时放宽到 10 分钟。
    location /api/ {
        proxy_pass http://maa-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 20s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # WebSocket (live logs)
    location /api/ws {
        proxy_pass http://maa-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
